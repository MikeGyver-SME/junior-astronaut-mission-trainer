<script>

const SITES = [

const CREW = [

  { id:'luan', name:'Luan', role:'Junior Researcher', initials:'L' },

const EVENTS = [
  { tag:'Power', title:'Dust Storm Rolling In', desc:'Solar panels are about to get covered. You need power for tonight\'s systems.',
    choices:[
      {label:'Retract & shield panels', effects:{power:-8, shield:+4}, note:'Saves the panels, costs setup power'},

    choices:[

    choices:[
      {label:'Seal the storm shelter', effects:{shield:+8, o2:-4}, note:'Strong protection, uses air'},

    ]},
  { tag:'Comms', title:'Signal Delay to Mission Control', desc:'A communications blackout means you must decide without backup for now.',
    choices:[
      {label:'Follow standard protocol', effects:{power:-3, shield:+3}, note:'Steady, cautious choice'},
      {label:'Make the call yourself', effects:{o2:+2, power:-2}, note:'Small balanced gain'},
      {label:'Wait for signal to return', effects:{o2:-5}, note:'Costs time and air'},
    ]},

const TOTAL_SOLS = 8;
const clamp = (v) => Math.max(0, Math.min(100, v));

let state = {
  screen: 'start',
  site: null,
  crew: null,
  outpostName: '',
  sol: 0,
  meters: { o2: 70, power: 70, shield: 70 },
  usedEvents: [],
  lastLog: '',
  endReason: null,
  earnedBadges: [],
  readyStep: 0,
  reaction: { phase:'idle', armAt:0, ms:null },
  sleepVal: 7,
  fatigueVal: 3,
  readinessScore: null,
  returnScreen: 'game',
  nasaData: { apod:null, marsPhoto:null, flares:null, radlab:null, status:'idle' },
  research: { query:'', status:'idle', results:null, errored:false },

// This game calls NASA's data through the Cloudflare Worker below, which keeps the
// real NASA API key server-side (as a Worker secret) instead of exposing it here.
const NASA_PROXY_BASE = 'https://nasa-data-proxy.mikegyver.workers.dev';
const DIRECT_FALLBACK_KEY = 'DEMO_KEY'; // only used if NASA_PROXY_BASE is ever cleared

// Real Mars Curiosity rover images, hotlinked directly from NASA's official image host.
// The third-party Mars Rover Photos API (api.nasa.gov/mars-photos) has become unreliable
// (frequent 404s on documented endpoints), so rather than depend on a flaky live call,
// these are verified real photos loaded as <img> tags, which sidesteps CORS entirely —
// CORS only restricts fetch()/XHR reading response data, not image display.
const MARS_PHOTO_SAMPLE = [
  {
    img_src: 'https://mars.jpl.nasa.gov/msl-raw-images/proj/msl/redops/ods/surface/sol/02026/opgs/edr/ncam/NRB_577361730EDR_M0691858NCAM00536M_.JPG',
    sol: 2026, camera: 'Right Navigation Camera', earth_date: 'April 18, 2018',
    sourceUrl: 'https://mars.nasa.gov/raw_images/502867/?site=msl'
  },
  {
    img_src: 'https://d9-wret.s3.us-west-2.amazonaws.com/assets/palladium/production/s3fs-public/styles/full_width/public/media/images/sol-04326.jpeg',
    sol: 4326, camera: 'Left Navigation Camera', earth_date: 'October 7, 2024',
    sourceUrl: 'https://www.usgs.gov/media/images/mars-rover-curiosity-photo-sol-4326'
  },
];

// Real ISS radiation dosimetry readings, pulled from NASA OSDR's RadLab API
// (https://visualization.osdr.nasa.gov/radlab/api/) and embedded here because
// RadLab's API does not send CORS headers, so browsers can never call it directly.
const RADLAB_SAMPLE = [
  { timestamp:'2019-12-05', instrument_family:'Timepix', module:'JPM', absorbed_dose_rate:17.30 },
  { timestamp:'2019-12-05', instrument_family:'Timepix', module:'Cupola', absorbed_dose_rate:13.58 },
  { timestamp:'2019-12-10', instrument_family:'Timepix', module:'JPM', absorbed_dose_rate:17.70 },
  { timestamp:'2019-12-10', instrument_family:'Timepix', module:'Cupola', absorbed_dose_rate:14.51 },
  { timestamp:'2019-12-14', instrument_family:'Timepix', module:'JPM', absorbed_dose_rate:17.96 },
  { timestamp:'2019-12-14', instrument_family:'Timepix', module:'Cupola', absorbed_dose_rate:15.44 },
];

const main = document.getElementById('main');
const solBadge = document.getElementById('solBadge');

function render(){
  solBadge.textContent =
    state.screen === 'start' ? 'Pre-Launch'
    : state.screen === 'readiness' ? 'Crew Readiness Check'
    : state.screen === 'data' ? 'NASA Live Data'
    : state.screen === 'research' ? 'NASA Research Mode'
    : state.screen === 'end' ? 'Mission Complete'
    : `Sol ${state.sol} / ${TOTAL_SOLS}`;

  if(state.screen === 'start') renderStart();
  else if(state.screen === 'readiness') renderReadiness();
  else if(state.screen === 'game') renderGame();
  else if(state.screen === 'data') renderNasaData();
  else if(state.screen === 'research') renderResearch();
  else renderEnd();
}

/* ================= LIVE NASA DATA ================= */
function openDataScreen(fromScreen){
  state.returnScreen = fromScreen;
  state.screen = 'data';
  render();
  if(state.nasaData.status === 'idle'){ loadNasaData(); }
}

async function loadNasaData(){
  state.nasaData.status = 'loading';
  render();

  const today = new Date();
  const weekAgo = new Date(today.getTime() - 7*24*60*60*1000);
  const fmt = (d) => d.toISOString().slice(0,10);

  const apodUrl = NASA_PROXY_BASE
    ? `${NASA_PROXY_BASE.replace(/\/$/, '')}/apod`
    : `https://api.nasa.gov/planetary/apod?api_key=${DIRECT_FALLBACK_KEY}`;

  const donkiUrl = NASA_PROXY_BASE
    ? `${NASA_PROXY_BASE.replace(/\/$/, '')}/donki-flr?startDate=${fmt(weekAgo)}&endDate=${fmt(today)}`
    : `https://api.nasa.gov/DONKI/FLR?startDate=${fmt(weekAgo)}&endDate=${fmt(today)}&api_key=${DIRECT_FALLBACK_KEY}`;

  const results = await Promise.allSettled([
    fetch(apodUrl).then(r => r.json()),
    fetch(donkiUrl).then(r => r.json()),
  ]);

  state.nasaData.apod = results[0].status === 'fulfilled' ? results[0].value : null;
  state.nasaData.flares = results[1].status === 'fulfilled' && Array.isArray(results[1].value) ? results[1].value : null;

  // Real hotlinked Mars image, picked at random from the verified sample above.
  state.nasaData.marsPhoto = MARS_PHOTO_SAMPLE[Math.floor(Math.random() * MARS_PHOTO_SAMPLE.length)];

  // RadLab's API has no CORS headers, so it can never be fetched directly from a browser.
  // This is a real dataset pulled from https://visualization.osdr.nasa.gov/radlab/api/ and embedded here.
  state.nasaData.radlab = RADLAB_SAMPLE;

  state.nasaData.status = 'loaded';
  render();
}

function flareRiskInfo(flares){
  if(!flares) return null;
  const count = flares.length;
  if(count === 0) return { level:'low', label:'Low — no recorded solar flares this week' };
  if(count <= 3) return { level:'mod', label:`Moderate — ${count} solar flare${count>1?'s':''} recorded this week` };
  return { level:'high', label:`Elevated — ${count} solar flares recorded this week` };
}

function renderNasaData(){
  const d = state.nasaData;
  const backLabel = state.returnScreen === 'start' ? 'Back to Setup' : 'Back to Mission';

  let body = '';
  if(d.status === 'loading' || d.status === 'idle'){
    body = `
      <div class="data-card"><div class="skeleton"></div></div>
      <div class="data-card"><div class="skeleton" style="height:60px;"></div></div>
      <div class="data-card"><div class="skeleton" style="height:60px;"></div></div>
      <p class="data-error">Pulling live data from api.nasa.gov...</p>
    `;
  } else {
    // APOD card
    if(d.apod && d.apod.url){
      const isImg = d.apod.media_type === 'image';
      body += `
        <div class="data-card">
          <span class="dc-tag">Astronomy Picture of the Day</span>
          <h3>${escapeHtml(d.apod.title || 'Today in Space')}</h3>
          ${isImg ? `<img src="${d.apod.url}" alt="${escapeHtml(d.apod.title || '')}"/>` : ''}
          <p>${escapeHtml(truncate(d.apod.explanation || '', 220))}</p>
          <div class="dc-source">Source: NASA APOD · <a href="${d.apod.hdurl || d.apod.url}" target="_blank" rel="noopener">View original</a></div>
        </div>`;
    } else {
      body += `<div class="data-card"><span class="dc-tag">Astronomy Picture of the Day</span><p class="data-error">Couldn't load today's image right now — NASA's demo API may be rate-limited. Try again shortly.</p></div>`;
    }

    // Mars rover card
    if(d.marsPhoto && d.marsPhoto.img_src){
      body += `
        <div class="data-card">
          <span class="dc-tag">Real Photo From Mars</span>
          <h3>Curiosity Rover — Sol ${d.marsPhoto.sol}</h3>
          <img src="${d.marsPhoto.img_src}" alt="Real photo from Curiosity rover on Mars" onerror="this.parentElement.querySelector('.data-error-inline')?.classList.remove('hidden'); this.style.display='none';"/>
          <p class="data-error-inline hidden" style="color:var(--bad);">Image failed to load — <a href="${d.marsPhoto.sourceUrl}" target="_blank" rel="noopener" style="color:var(--ready);">view it directly on NASA's site</a>.</p>
          <p>Captured by the ${escapeHtml(d.marsPhoto.camera)} on ${escapeHtml(d.marsPhoto.earth_date)}, real Martian day (sol) ${d.marsPhoto.sol} of Curiosity's mission.</p>
          <div class="dc-source">Source: NASA/JPL-Caltech · <a href="${d.marsPhoto.sourceUrl}" target="_blank" rel="noopener">View original</a></div>
        </div>`;
    } else {
      body += `<div class="data-card"><span class="dc-tag">Real Photo From Mars</span><p class="data-error">Couldn't load a Mars photo right now.</p></div>`;
    }

    // DONKI space weather card
    const risk = flareRiskInfo(d.flares);
    body += `
      <div class="data-card">
        <span class="dc-tag">Real Radiation Risk This Week</span>
        <h3>Space Weather — Solar Flare Activity</h3>
        ${risk ? `<span class="risk-pill ${risk.level}">${risk.level === 'low' ? '🟢' : risk.level === 'mod' ? '🟡' : '🔴'} ${risk.label}</span>` : ''}
        <p>${risk ? 'This is the actual solar flare count NASA tracked over the past 7 days — the same kind of data flight controllers use to decide when to reinforce shielding, just like in your mission.' : "Couldn't load current solar flare data right now."}</p>
        <div class="dc-source">Source: NASA DONKI (Space Weather Database)</div>
      </div>`;

    // RadLab astronaut radiation dosimetry card
    if(d.radlab && d.radlab.length){
      const avgDose = d.radlab.reduce((sum, r) => sum + r.absorbed_dose_rate, 0) / d.radlab.length;
      body += `
        <div class="data-card">
          <span class="dc-tag">Real Astronaut Health Data</span>
          <h3>ISS Radiation Dosimetry — RadLab</h3>
          <p>Actual absorbed radiation dose readings recorded by REM instruments aboard the ISS, averaging <b style="color:var(--star);">${avgDose.toFixed(1)} µGy/hour</b> across ${d.radlab.length} readings from this sample. This is the same type of measurement NASA uses to track real astronaut radiation exposure over a mission — exactly what your Shielding meter represents in-game.</p>
          <div class="dc-source">Source: NASA OSDR RadLab — real dataset, embedded here since RadLab's API doesn't support in-browser requests. <a href="https://visualization.osdr.nasa.gov/radlab/gui/data-api/" target="_blank" rel="noopener">See the live API</a></div>
        </div>`;
    } else {
      body += `<div class="data-card"><span class="dc-tag">Real Astronaut Health Data</span><p class="data-error">Couldn't load ISS radiation dosimetry data right now.</p></div>`;
    }
  }

  main.innerHTML = `
    <div class="data-screen">
      <h1>📡 Live NASA Data</h1>
      <p class="sub">Real data pulled from NASA's public APIs — current space imagery and space weather, plus real archival astronaut radiation readings — the same kinds of data mission planners actually use.</p>
      ${body}
      <button class="ghost" id="dataBackBtn">${backLabel}</button>
    </div>
  `;
  document.getElementById('dataBackBtn').onclick = () => { state.screen = state.returnScreen; render(); };
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function truncate(str, n){ return str.length > n ? str.slice(0,n).trim() + '…' : str; }

/* ================= RESEARCH MODE (OSDR Study Search) ================= */
const SUGGESTED_KEYWORDS = ['Radiation', 'Bone density', 'Muscle', 'Sleep', 'Immune system', 'Microgravity', 'Plants', 'Mars'];

function openResearchScreen(fromScreen){
  state.returnScreen = fromScreen;
  state.screen = 'research';
  render();
}

async function runOsdrSearch(term){
  term = term.trim();
  if(!term) return;
  state.research.query = term;
  state.research.status = 'loading';
  state.research.errored = false;
  render();

  try{
    // When NASA_PROXY_BASE is set, the worker exposes a short /osdr-search route;
    // otherwise call NASA's own path directly.
    const buildUrl = (params) => NASA_PROXY_BASE
      ? `${NASA_PROXY_BASE.replace(/\/$/, '')}/osdr-search?${params}`
      : `https://osdr.nasa.gov/osdr/data/search?${params}`;

    // Try NASA's own OSDR/GeneLab studies first (data_source = cgene)
    let res = await fetch(buildUrl(`term=${encodeURIComponent(term)}&type=cgene&size=6`));
    let json = await res.json();
    let hits = (json.hits && json.hits.hits) ? json.hits.hits : [];

    // Fall back to the broader federated index if NASA's own studies come up empty
    if(hits.length === 0){
      res = await fetch(buildUrl(`term=${encodeURIComponent(term)}&size=6`));
      json = await res.json();
      hits = (json.hits && json.hits.hits) ? json.hits.hits : [];
    }

    state.research.results = hits;
    state.research.status = 'loaded';
  } catch(err){
    state.research.results = null;
    state.research.errored = true;
    state.research.status = 'loaded';
  }
  render();
}

function studyLink(source, accession){
  if(!accession) return null;
  if(accession.startsWith('OSD-') || accession.startsWith('GLDS-')){
    return `https://osdr.nasa.gov/bio/repo/data/studies/${accession}`;
  }
  if(accession.startsWith('GSE')){
    return `https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=${accession}`;
  }
  return `https://osdr.nasa.gov/bio/repo`;
}

function renderResearch(){
  const backLabel = state.returnScreen === 'start' ? 'Back to Setup' : 'Back to Mission';
  const r = state.research;

  main.innerHTML = `
    <div class="data-screen">
      <h1>🔬 NASA Research Mode</h1>
      <p class="sub">Search NASA's real Open Science Data Repository (OSDR) — the same space biology database researchers use to study how astronaut bodies respond to spaceflight.</p>

      <div class="research-note">OSDR holds real studies on how spaceflight affects living things — from mice to microbes to astronauts. Try a keyword from your mission, or your own.</div>

      <div class="keyword-chips" id="kwChips"></div>

      <div class="search-row">
        <input type="text" id="researchInput" placeholder="e.g. radiation, bone density, sleep..." value="${escapeHtml(r.query)}"/>
        <button id="researchSearchBtn">Search</button>
      </div>

      <div id="researchResults"></div>

      <button class="ghost" id="researchBackBtn">${backLabel}</button>
    </div>
  `;

  const chipWrap = document.getElementById('kwChips');
  SUGGESTED_KEYWORDS.forEach(kw => {
    const chip = document.createElement('button');
    chip.className = 'kw-chip';
    chip.textContent = kw;
    chip.onclick = () => {
      document.getElementById('researchInput').value = kw;
      runOsdrSearch(kw);
    };
    chipWrap.appendChild(chip);
  });

  const input = document.getElementById('researchInput');
  document.getElementById('researchSearchBtn').onclick = () => runOsdrSearch(input.value);
  input.onkeydown = (e) => { if(e.key === 'Enter') runOsdrSearch(input.value); };
  document.getElementById('researchBackBtn').onclick = () => { state.screen = state.returnScreen; render(); };

  renderResearchResults();
}

function renderResearchResults(){
  const box = document.getElementById('researchResults');
  const r = state.research;
  if(!box) return;

  if(r.status === 'idle'){
    box.innerHTML = '';
    return;
  }
  if(r.status === 'loading'){
    box.innerHTML = `<div class="data-card"><div class="skeleton" style="height:70px;"></div></div><div class="data-card"><div class="skeleton" style="height:70px;"></div></div>`;
    return;
  }
  if(r.errored){
    const proxyHint = NASA_PROXY_BASE
      ? "The proxy couldn't reach OSDR right now."
      : "This is a known CORS restriction on NASA's OSDR server — deploying the companion Cloudflare Worker (see nasa-proxy-worker.js) fixes this permanently.";
    box.innerHTML = `
      <div class="data-card">
        <span class="dc-tag">Search Unavailable</span>
        <p class="data-error">${proxyHint} You can search the same real database yourself:</p>
        <a class="sc-link" href="https://osdr.nasa.gov/bio/repo" target="_blank" rel="noopener">Open NASA OSDR Search →</a>
      </div>`;
    return;
  }
  if(!r.results || r.results.length === 0){
    box.innerHTML = `<div class="data-card"><p class="data-error">No studies found for "${escapeHtml(r.query)}" — try a different keyword like radiation, bone, or muscle.</p></div>`;
    return;
  }

  box.innerHTML = r.results.map(hit => {
    const s = hit._source || {};
    const title = s['Study Title'] || s['Project Title'] || 'Untitled Study';
    const accession = s['Accession'] || hit._id || '';
    const rawOrganism = s['organism'];
    const organisms = Array.isArray(rawOrganism)
      ? (rawOrganism.length ? rawOrganism.join(', ') : null)
      : (typeof rawOrganism === 'string' && rawOrganism.trim() ? rawOrganism : null);
    const source = s['Data Source Type'] === 'cgene' ? 'NASA OSDR' : (s['Data Source Type'] || 'Federated source');
    const releaseDate = s['Study Public Release Date'] ? new Date(s['Study Public Release Date'] * 1000).getFullYear() : null;
    const desc = s['Study Description'] || '';
    const link = studyLink(source, accession);

    return `
      <div class="study-card">
        <div class="sc-top">
          <h4>${escapeHtml(truncate(title, 100))}</h4>
          ${accession ? `<span class="sc-accession">${escapeHtml(accession)}</span>` : ''}
        </div>
        <div class="sc-meta">
          <span>${escapeHtml(source)}</span>
          ${organisms ? `<span>${escapeHtml(organisms)}</span>` : ''}
          ${releaseDate ? `<span>${releaseDate}</span>` : ''}
        </div>
        ${desc ? `<p>${escapeHtml(truncate(desc, 180))}</p>` : ''}
        ${link ? `<a class="sc-link" href="${link}" target="_blank" rel="noopener">View real study on NASA OSDR →</a>` : ''}
      </div>`;
  }).join('');
}

function renderStart(){
  main.innerHTML = `
    <div class="start">
      <h1>Build Your Outpost</h1>
      <p class="sub">Choose your crew member, pick a site, name your outpost — then pass a quick readiness check before launch.</p>

      <label class="fieldlabel">Who's on duty?</label>
      <div class="crew-select" id="crewSelect"></div>

      <label class="fieldlabel">Choose your site</label>
      <div class="site-select" id="siteSelect"></div>

      <label class="fieldlabel">Name your outpost</label>
      <input class="namefield" id="nameInput" maxlength="24" placeholder="e.g. Titan City" value="${state.outpostName}"/>

      <button class="primary" id="launchBtn" disabled>Continue to Readiness Check</button>
      <button class="data-btn" id="openDataBtnStart" style="margin-top:10px;">📡 Explore Live NASA Data First</button>
      <button class="data-btn" id="openResearchBtnStart" style="margin-top:10px;">🔬 Search NASA Research (OSDR)</button>
    </div>
  `;

  const crewSelect = document.getElementById('crewSelect');
  CREW.forEach(c => {
    const chip = document.createElement('button');
    chip.className = 'crew-chip' + (state.crew === c.id ? ' selected' : '');
    chip.innerHTML = `<div class="avatar">${c.initials}</div><strong>${c.name}</strong><span>${c.role}</span>`;
    chip.onclick = () => { state.crew = c.id; render(); };
    crewSelect.appendChild(chip);
  });

  const siteSelect = document.getElementById('siteSelect');
  SITES.forEach(site => {
    const card = document.createElement('button');
    card.className = 'site-card' + (state.site === site.id ? ' selected' : '');
    card.innerHTML = `<span class="emoji">${site.emoji}</span><strong>${site.name}</strong><span>${site.tagline}</span>`;
    card.onclick = () => { state.site = site.id; render(); };
    siteSelect.appendChild(card);
  });

  const nameInput = document.getElementById('nameInput');
  nameInput.oninput = (e) => { state.outpostName = e.target.value; updateLaunchButton(); };

  const launchBtn = document.getElementById('launchBtn');
  launchBtn.onclick = () => {
    state.readyStep = 0;
    state.reaction = { phase:'idle', armAt:0, ms:null };
    state.sleepVal = 7;
    state.fatigueVal = 3;
    state.readinessScore = null;
    state.screen = 'readiness';
    render();
  };
  updateLaunchButton();
  document.getElementById('openDataBtnStart').onclick = () => openDataScreen('start');
  document.getElementById('openResearchBtnStart').onclick = () => openResearchScreen('start');

  function updateLaunchButton(){
    launchBtn.disabled = !(state.site && state.crew && state.outpostName.trim().length > 0);
  }
}

function progressDots(activeIdx, total){
  let html = '';
  for(let i=0;i<total;i++){
    const cls = i < activeIdx ? 'done' : (i === activeIdx ? 'active' : '');
    html += `<span class="${cls}"></span>`;
  }
  return html;
}

function renderReadiness(){
  const crewName = CREW.find(c => c.id === state.crew)?.name || 'Crew';

  if(state.readyStep === 0){
    main.innerHTML = readinessIntroHTML(crewName);
    document.getElementById('startCheckBtn').onclick = () => { state.readyStep = 1; render(); };
    return;
  }
  if(state.readyStep === 1){
    main.innerHTML = reactionTestHTML(crewName);
    wireReactionTest();
    return;
  }
  if(state.readyStep === 2){
    main.innerHTML = sleepFatigueHTML(crewName);
    wireSliders();
    return;
  }
  renderReadinessSummary(crewName);
}

function readinessIntroHTML(crewName){
  return `
    <div class="ready-screen">
      <div class="ready-progress">${progressDots(0,3)}</div>
      <h1>Pre-Flight Readiness Check</h1>
      <p class="sub">Before ${crewName} launches, Mission Control runs a 60-second readiness check — reaction time, sleep, and fatigue. A stronger check means a stronger start on the surface.</p>
      <div class="test-card">
        <h3>🧑‍🚀 ${crewName}, ready to begin?</h3>
        <p class="desc">You'll do one quick reaction test, then rate your sleep and energy.</p>
      </div>
      <button class="primary" id="startCheckBtn">Start Readiness Check</button>
    </div>
  `;
}

function reactionTestHTML(crewName){
  const pad = state.reaction;
  let padClass = '', padText = 'Tap to arm the sensor';
  if(pad.phase === 'armed'){ padClass = 'armed'; padText = 'Wait for green...'; }
  else if(pad.phase === 'go'){ padClass = 'go'; padText = 'TAP NOW!'; }
  else if(pad.phase === 'tooSoon'){ padClass = 'tooSoon'; padText = 'Too soon! Tap to retry.'; }
  else if(pad.phase === 'done'){ padClass = ''; padText = `Reaction: ${pad.ms} ms — tap Continue`; }

  return `
    <div class="ready-screen">
      <div class="ready-progress">${progressDots(1,3)}</div>
      <h1>Reaction Test</h1>
      <p class="sub">Tap the pad to arm it, then tap again the instant it turns green.</p>
      <div class="test-card">
        <h3>⚡ Hand-Eye Response</h3>
        <p class="desc">Measures how quickly ${crewName} reacts to an alert.</p>
        <div class="reaction-pad ${padClass}" id="reactionPad">${padText}</div>
      </div>
      <button class="primary" id="reactionContinueBtn" ${pad.phase === 'done' ? '' : 'disabled'}>Continue</button>
    </div>
  `;
}

function wireReactionTest(){
  const padEl = document.getElementById('reactionPad');
  const continueBtn = document.getElementById('reactionContinueBtn');

  padEl.onclick = () => {
    const pad = state.reaction;
    if(pad.phase === 'idle' || pad.phase === 'tooSoon'){
      pad.phase = 'armed';
      const delay = 800 + Math.random()*1800;
      pad.timer = setTimeout(() => {
        pad.phase = 'go';
        pad.armAt = performance.now();
        render();
      }, delay);
      render();
    } else if(pad.phase === 'armed'){
      clearTimeout(pad.timer);
      pad.phase = 'tooSoon';
      render();
    } else if(pad.phase === 'go'){
      pad.ms = Math.round(performance.now() - pad.armAt);
      pad.phase = 'done';
      render();
    }
  };

  continueBtn.onclick = () => {
    if(state.reaction.phase === 'done'){ state.readyStep = 2; render(); }
  };
}

function sleepFatigueHTML(crewName){
  return `
    <div class="ready-screen">
      <div class="ready-progress">${progressDots(2,3)}</div>
      <h1>Sleep &amp; Fatigue</h1>
      <p class="sub">Self-report how ${crewName} is feeling right now.</p>
      <div class="test-card" style="text-align:left;">
        <div class="slider-wrap" style="margin-bottom:22px;">
          <div class="slabel">😴 Sleep quality last night <b id="sleepOut">${state.sleepVal}</b>/10</div>
          <input type="range" min="1" max="10" value="${state.sleepVal}" id="sleepSlider"/>
          <div class="scale-hint"><span>Rough night</span><span>Fully rested</span></div>
        </div>
        <div class="slider-wrap">
          <div class="slabel">🔋 Current fatigue <b id="fatigueOut">${state.fatigueVal}</b>/10</div>
          <input type="range" min="1" max="10" value="${state.fatigueVal}" id="fatigueSlider"/>
          <div class="scale-hint"><span>Wide awake</span><span>Exhausted</span></div>
        </div>
      </div>
      <button class="primary" id="finishCheckBtn">Analyze Readiness</button>
    </div>
  `;
}

function wireSliders(){
  const sleepSlider = document.getElementById('sleepSlider');
  const fatigueSlider = document.getElementById('fatigueSlider');
  sleepSlider.oninput = (e) => { state.sleepVal = +e.target.value; document.getElementById('sleepOut').textContent = state.sleepVal; };
  fatigueSlider.oninput = (e) => { state.fatigueVal = +e.target.value; document.getElementById('fatigueOut').textContent = state.fatigueVal; };
  document.getElementById('finishCheckBtn').onclick = () => {
    computeReadiness();
    state.readyStep = 3;
    render();
  };
}

function computeReadiness(){
  const ms = state.reaction.ms || 500;
  let reactionScore;
  if(ms < 300) reactionScore = 100;
  else if(ms < 450) reactionScore = 85;
  else if(ms < 650) reactionScore = 65;
  else if(ms < 900) reactionScore = 45;
  else reactionScore = 25;

  const sleepScore = state.sleepVal * 10;
  const fatigueScore = (10 - state.fatigueVal) * 10;

  const readiness = Math.round((reactionScore + sleepScore + fatigueScore) / 3);
  state.readinessScore = clamp(readiness);

  state.earnedBadges = [];
  if(state.readinessScore >= 85) state.earnedBadges.push({emoji:'🌟', label:'Flight Ready'});
  if(ms < 300) state.earnedBadges.push({emoji:'⚡', label:'Quick Reflexes'});
  if(state.sleepVal >= 8 && state.fatigueVal <= 3) state.earnedBadges.push({emoji:'😴', label:'Well Rested'});
}

function renderReadinessSummary(crewName){
  const score = state.readinessScore;
  const ringColor = score >= 80 ? 'var(--good)' : score >= 55 ? 'var(--warn)' : 'var(--bad)';
  const verdict = score >= 80 ? 'Excellent — full go for launch.'
    : score >= 55 ? 'Good — cleared for launch with standard margins.'
    : 'Marginal — launch cleared, but start with tighter reserves.';

  main.innerHTML = `
    <div class="ready-screen">
      <div class="ready-progress">${progressDots(3,3)}</div>
      <h1>${crewName}'s Readiness</h1>
      <div class="readiness-summary">
        <div class="ring" style="background: conic-gradient(${ringColor} ${score*3.6}deg, rgba(255,255,255,.08) 0deg);">
          <div class="num">${score}</div>
          <div class="lbl">Readiness</div>
        </div>
        <p class="sub" style="margin-bottom:2px;">${verdict}</p>
        ${state.earnedBadges.length ? `<div class="badge-strip">${state.earnedBadges.map(b => `<span class="badge-pill">${b.emoji} ${b.label}</span>`).join('')}</div>` : ''}
      </div>
      <button class="primary" id="beginMissionBtn">Begin Mission</button>
    </div>
  `;
  document.getElementById('beginMissionBtn').onclick = startGame;
}

function pickEvent(){
  let available = EVENTS.filter((_, i) => !state.usedEvents.includes(i));
  if(available.length === 0){ state.usedEvents = []; available = EVENTS; }
  const idx = EVENTS.indexOf(available[Math.floor(Math.random()*available.length)]);
  state.usedEvents.push(idx);
  return EVENTS[idx];
}

function startGame(){
  const bonus = Math.round((state.readinessScore - 65) / 4);
  const base = clamp(65 + bonus);

  state.screen = 'game';
  state.sol = 1;
  state.meters = { o2: base, power: base, shield: base };
  state.usedEvents = [];
  const crewName = CREW.find(c => c.id === state.crew)?.name || 'Crew';
  state.lastLog = `${crewName} is mission-go — readiness score ${state.readinessScore} set your starting reserves.`;
  state.currentEvent = pickEvent();
  render();
}

function domeSVG(site){
  const c = site.domeColor;
  return `
  <svg width="150" height="90" viewBox="0 0 150 90" class="dome-svg">
    <ellipse cx="75" cy="72" rx="62" ry="8" fill="rgba(0,0,0,.35)"/>
    <path d="M13 72 A62 62 0 0 1 137 72 Z" fill="${c}" stroke="#3DA9FC" stroke-width="1.5" opacity="0.92"/>
    <path d="M13 72 A62 62 0 0 1 137 72" fill="none" stroke="#3DA9FC" stroke-width="1.2" opacity="0.5"/>
    <line x1="13" y1="72" x2="137" y2="72" stroke="#0A1830" stroke-width="2"/>
    <line x1="75" y1="10" x2="75" y2="72" stroke="#0A1830" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="30" x2="120" y2="30" stroke="#0A1830" stroke-width="1" opacity="0.35"/>
    <circle cx="55" cy="50" r="5" fill="#F5C542" opacity="0.85"/>
    <circle cx="95" cy="55" r="4" fill="#F5C542" opacity="0.6"/>
  </svg>`;
}

function meterRow(icon, label, key, colorClass){
  const val = Math.round(state.meters[key]);
  return `
    <div class="meter-row">
      <div class="meter-icon">${icon}</div>
      <div class="meter-label">${label}</div>
      <div class="meter-track"><div class="meter-fill ${colorClass}" style="width:${val}%"></div></div>
      <div class="meter-value">${val}%</div>
    </div>`;
}

function renderGame(){
  const site = SITES.find(s => s.id === state.site);
  const crew = CREW.find(c => c.id === state.crew);
  const ev = state.currentEvent;

  main.innerHTML = `
    <div class="dome-wrap">
      <div class="site-name-tag">${site.emoji} ${state.outpostName}</div>
      <div class="risk-tag">${site.name}</div>
      ${domeSVG(site)}
      <div class="crew-tag">👤 ${crew.name} · Readiness ${state.readinessScore}</div>
      <div class="surface"></div>
    </div>

    <div class="meters">
      ${meterRow('💨','O2 Supply','o2','o2')}
      ${meterRow('⚡','Power','power','power')}
      ${meterRow('🛡️','Shielding','shield','shield')}
    </div>

    <div class="event-card">
      <span class="tag">${ev.tag}</span>
      <h2>${ev.title}</h2>
      <p>${ev.desc}</p>
    </div>

    <div class="choices" id="choices"></div>
    <div class="log">${state.lastLog}</div>

    <button class="data-btn" id="openDataBtn" style="margin-top:14px;">📡 Check Live NASA Data</button>
    <button class="data-btn" id="openResearchBtn" style="margin-top:9px;">🔬 Search NASA Research (OSDR)</button>
  `;

  document.getElementById('openDataBtn').onclick = () => openDataScreen('game');
  document.getElementById('openResearchBtn').onclick = () => openResearchScreen('game');

  const choicesEl = document.getElementById('choices');
  ev.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const effectsHTML = Object.entries(choice.effects).map(([k,v]) => {
      const iconMap = {o2:'💨', power:'⚡', shield:'🛡️'};
      const cls = v >= 0 ? 'pos' : 'neg';
      const sign = v >= 0 ? '+' : '';
      return `<span class="eff ${cls}">${iconMap[k]} ${sign}${v}</span>`;
    }).join('');
    btn.innerHTML = `<span class="c-title">${choice.label}</span><span class="c-effects">${effectsHTML}</span>`;
    btn.onclick = () => applyChoice(choice);
    choicesEl.appendChild(btn);
  });
}

function applyChoice(choice){
  Object.entries(choice.effects).forEach(([k,v]) => { state.meters[k] = clamp(state.meters[k] + v); });
  state.lastLog = choice.note;

  const failed = Object.entries(state.meters).find(([k,v]) => v <= 0);
  if(failed){
    const names = {o2:'life support', power:'power', shield:'shielding'};
    state.endReason = `fail-${failed[0]}`;
    state.failMeter = names[failed[0]];
    state.screen = 'end';
    render();
    return;
  }

  if(state.sol >= TOTAL_SOLS){
    state.endReason = 'success';
    if(Math.min(state.meters.o2, state.meters.power, state.meters.shield) >= 50){
      state.earnedBadges.push({emoji:'🛠️', label:'Steady Hand'});
    }
    state.earnedBadges.push({emoji:'🏁', label:'Full Mission Survivor'});
    state.screen = 'end';
    render();
    return;
  }

  state.sol += 1;
  state.currentEvent = pickEvent();
  render();
}

function renderEnd(){
  const success = state.endReason === 'success';
  const avg = Math.round((state.meters.o2 + state.meters.power + state.meters.shield) / 3);
  const crew = CREW.find(c => c.id === state.crew);

  let emoji, title, msg;
  if(success){
    emoji = '🏆';
    title = `${state.outpostName} Made It!`;
    msg = `${crew.name} kept the crew alive for ${TOTAL_SOLS} sols on ${SITES.find(s=>s.id===state.site).name} with an average systems health of ${avg}%. Nice mission command work.`;
  } else {
    emoji = '💥';
    title = `Mission Interrupted`;
    msg = `${state.outpostName} lost critical ${state.failMeter} on Sol ${state.sol}. Real mission planners face this exact trade-off every day — try again with a different strategy.`;
  }

  main.innerHTML = `
    <div class="end">
      <span class="badge-emoji">${emoji}</span>
      <h1>${title}</h1>
      <p>${msg}</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${state.sol}</div><div class="l">Sols Survived</div></div>
        <div class="stat-box"><div class="n">${Math.round(state.meters.o2)}%</div><div class="l">Final O2</div></div>
        <div class="stat-box"><div class="n">${Math.round(state.meters.power)}%</div><div class="l">Final Power</div></div>
      </div>
      ${state.earnedBadges.length ? `<div class="badge-strip">${state.earnedBadges.map(b => `<span class="badge-pill">${b.emoji} ${b.label}</span>`).join('')}</div>` : ''}
      <button class="primary" id="retryBtn" style="margin-top:16px;">Fly Again</button>
      <button class="ghost" id="newSiteBtn">Choose a Different Crew or Site</button>
    </div>
  `;

  document.getElementById('retryBtn').onclick = () => {
    state.readyStep = 0;
    state.reaction = { phase:'idle', armAt:0, ms:null };
    state.sleepVal = 7;
    state.fatigueVal = 3;
    state.screen = 'readiness';
    render();
  };
  document.getElementById('newSiteBtn').onclick = () => { state.screen = 'start'; render(); };
}

render();
</script>

</body>
</html>
